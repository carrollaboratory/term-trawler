warehouse:
  db_uri: "postgresql+psycopg2://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
vocabularies:
  - vocabulary_id: "2.16.840.1.113883.6.238"
    vocabulary_name: "CDC Rec"
    description: "The U.S. Centers for Disease Control and Prevention (CDC) has prepared a code set for use in coding race and ethnicity data. This code set is based on current federal standards for classifying data on race and ethnicity, specifically the minimum race and ethnicity categories defined by the U.S. Office of Management and Budget (OMB) and a more detailed set of race and ethnicity categories maintained by the U.S. Bureau of the Census (BC)."
    prefix: "CDCREC"
    fhir_system: "urn:oid:2.16.840.1.113883.6.238"
    vocabulary_uri: "https://cdc.gov#[code]"
    source_filename: "fhir/cdc-rec.json"
    source_type: "FHIR"
  - vocabulary_id: "condition-ver-status"
    vocabulary_name: "ConditionVerificationStatus"
    description: "The verification status to support or decline the clinical status of the condition or diagnosis."
    prefix: "condition-ver-status"
    fhir_system: "http://terminology.hl7.org/CodeSystem/condition-ver-status"
    vocabulary_uri: "http://terminology.hl7.org/CodeSystem/condition-ver-status#[code]"
    source_filename: "https://terminology.hl7.org/7.4.0/en/CodeSystem-condition-ver-status.json"
    source_type: "FHIR"
  - vocabulary_id: "v3-NullFlavor"
    vocabulary_name: "NullFlavor"
    description: "A collection of codes specifying why a valid value is not present."
    prefix: "v3-nullflavor"
    fhir_system: "http://terminology.hl7.org/CodeSystem/v3-NullFlavor"
    vocabulary_uri: "http://terminology.hl7.org/CodeSystem/v3-NullFlavor#[code]"
    source_filename: "https://terminology.hl7.org/7.4.0/en/CodeSystem-v3-NullFlavor.json"
    source_type: "FHIR"
  - vocabulary_id: "v3-RoleCode"
    vocabulary_name: "RoleCode"
    description: "A set of codes further specifying the kind of Role; specific classification codes for further qualifying RoleClass codes."
    prefix: "v3-rolecode"
    fhir_system: "http://terminology.hl7.org/CodeSystem/v3-RoleCode"
    vocabulary_uri: "http://terminology.hl7.org/CodeSystem/v3-RoleCode#[code]"
    source_filename: "https://terminology.hl7.org/7.4.0/en/CodeSystem-v3-RoleCode.json"
    source_type: "FHIR"
  - vocabulary_id: "SNOMED"
    vocabulary_name: "Systematic Nomenclature of Medicine - Clinical Terms"
    description: "SNOMED CT (Systematized Nomenclature of Medicine Clinical Terms) is a comprehensive clinical terminology used to code, query and analyze health data. The terminology system is maintained and distributed by SNOMED International, the trading name of the International Health Terminology Standards Development Organisation (IHTSDO), established in 2007."
    prefix: "snomedct"
    fhir_system: "http://snomed.info/sct"
    vocabulary_uri: "http://snomed.info/id/[code]"
    source_filename: "/mnt/c/Users/kerny/Documents/vocabulary_download_v5zip.zip"
    source_type: "OMOP"
  - vocabulary_id: "HPO"
    vocabulary_name: "Human Phenotype Ontology"
    description: "The Human Phenotype Ontology (HPO) aims to provide a standardized vocabulary of phenotypic abnormalities encountered in human disease."
    prefix: "HP"
    fhir_system: "http://human-phenotype-ontology.org"
    vocabulary_uri: "http://purl.obolibrary.org/obo/[code]"
    source_filename: "/mnt/c/Users/kerny/Documents/vocabulary_download_v5zip.zip"
    source_type: "OMOP"
  - vocabulary_id: "LOINC"
    vocabulary_name: "Logical Observation Identifiers Names and Codes"
    description: "The international standard for identifying health measurements, observations, and documents."
    prefix: "loinc"
    fhir_system: "http://loinc.org"
    vocabulary_uri: "http://loinc.org/rdf/[code]"
    source_filename: "/mnt/c/Users/kerny/Documents/vocabulary_download_v5_loinc.zip"
    source_type: "OMOP"
  - vocabulary_id: "NCIT"
    vocabulary_name: "National Cancer Institute Thesaurus"
    description: "The international standard for identifying health measurements, observations, and documents."
    prefix: "NCIT"
    fhir_system: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl"
    vocabulary_uri: "http://purl.obolibrary.org/obo/[code]"
    source_filename: "/mnt/c/Users/kerny/Documents/vocabulary_download_v5zip.zip"
    source_type: "OMOP"
  - vocabulary_name: "EDAM - The ontology of data analysis and management"
    description: "EDAM is a comprehensive ontology of well-established, familiar concepts that are prevalent within scientific data analysis and data management (both within and beyond life sciences and imaging)."
    prefix: "edam"
    fhir_system: "http://edamontology.org/EDAM.owl"
    vocabulary_uri: "http://edamontology.org/[code]"
    owl_file: "http://edamontology.org/EDAM.owl" # where to download owl file
    source_type: "OWL"
  - vocabulary_name: "KIN - The Family History Relations Ontology"
    description: "KIN is a family relations ontology developed as part of the Global Alliance for Genomics and Health Pedigree Standard project. It allows using an OWL reasoner to automatically validate a family history graph and infer new relations."
    prefix: "KIN"
    fhir_system: "http://purl.org"
    vocabulary_uri: "http://purl.org/ga4gh/kin.owl#[code]"
    owl_file: "http://purl.org/ga4gh/kin.owl"
    ssl_no_verify: true
    source_type: "OWL"
  - vocabulary_name: "National Cancer Institute Thesaurus"
    description: "The international standard for identifying health measurements, observations, and documents."
    prefix: "NCIT"
    fhir_system: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl"
    vocabulary_uri: "http://purl.obolibrary.org/obo/[code]"
    owl_file: "http://purl.obolibrary.org/obo/ncit.owl" # where to download owl file
    source_type: "OWL"
  - vocabulary_name: "Common Access Model Concepts"
    description: "This vocabulary defines local CURIE placeholders for Common Access Model string enumerations that currently lack standard public ontology"
    prefix: "CAMO"
    fhir_system: "https://github.com/include-dcc/camo/releases/latest/download/camo.owl"
    vocabulary_uri: "https://github.com/carrollaboratory/vocab-forge/[code]"
    owl_file: "https://github.com/include-dcc/camo/releases/latest/download/camo.owl#"
    source_type: "OWL"
