  - vocabulary_id: "2.16.840.1.113883.6.238"
    vocabulary_name: "CDC REC"
    description: "The U.S. Centers for Disease Control and Prevention (CDC) has prepared a code set for use in coding race and ethnicity data, Race and Ethnicity Codes (REC). This code set is based on current federal standards for classifying data on race and ethnicity, specifically the minimum race and ethnicity categories defined by the U.S. Office of Management and Budget (OMB) and a more detailed set of race and ethnicity categories maintained by the U.S. Bureau of the Census (BC)."
    prefix: "CDCREC"
    fhir_system: "urn:oid:2.16.840.1.113883.6.238"
    vocabulary_uri: "https://cdc.gov#[code]"
    source_filename: "https://phinvads.cdc.gov/baseStu3/CodeSystem/2.16.840.1.113883.6.238"
    source_type: "FHIR"
