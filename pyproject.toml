[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "term-trawler"
description = "Terminology collection script"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "requests",
    "PyYAML",
    "sqlalchemy>=2.0.51",
    "car-utils",
    "rich>=15.0.0",
    "psycopg2-binary>=2.9.12",
    "common-access-model",
    "py-horned-owl>=2.0.0",
    "python-dotenv>=1.2.4",
    "duckdb==1.3.2", #AnVIL's duckdb version is pretty old. We should bump this up whenever they do, because it has a ton of dependencies and failed once on install for me
    #"duckdb>=2.0.0",
    "duckdb-engine>=0.17.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "rich",
    "pytest",
    "rich_argparse",
    "rdflib"
]

[tool.setuptools_scm]
version_file = "src/ttrawler/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.uv.sources]
common-access-model = { url = "https://github.com/include-dcc/common-access-model/releases/download/v0.2.0/common_access_model-0.2.0-py3-none-any.whl" }
car-utils = { git = "https://github.com/carrollaboratory/car-utils.git" }

[project.scripts]
trawler = "trawler:exec"
shrimp-basket = "shrimp:exec"
