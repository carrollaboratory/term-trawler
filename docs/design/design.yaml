# ============================================================
# 8. RISKS & MITIGATIONS
# ============================================================
risks:
  - id: R-001
    description: "Large input data may be too large for some tooling"
    likelihood: low # low | medium | high
    impact: low # low | medium | high
    mitigation: |
      We'll be streaming most of the data directly from file to avoid data
      loading restrictions for large data components like OMOP.
  - id: R-002
    description: "rdflib is unfamiliar and may not handle EDAM correctly"
    likelihood: low
    impact: low
    mitigation: |
      No one on the team has used this library before. If there are issues
      using the library, we will have to fall back to searching for an
      alternative approach to loading data in OWL format.

