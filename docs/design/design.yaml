# ============================================================
# 5. TECHNICAL DESIGN
# ============================================================
technical_design:
  architecture:
    description: >
      Trawler Ingest - Basic wrapper that loads the configuration to determine
      which terminologies are to be found and how they are to be harvested.
    components:
      - name: Trawler
        description: |
          Main application that loads YAML config and iterates over each of
          terminologies and runs the appropriate ingest calls
        technology: Python w/ YAML config
      - name: Term Extractor
        description: |
          Adapter pattern to allow the trawler to load data from varied
          sources using a common interface. Initial adapters include: OMOP,
          OWL
      - name: Term Loader
        description: |
          Loads data into the defined schema the [SQL Alchemy interface](https://github.com/carrollaboratory/piper/blob/main/src/piper/datamodel/linkml.py). This
          will require the DBT staging template name as well as the target
          model's SQL Alchemy model added as a dependency to the execution
          repository.

  data_model:
    description: >
      The resulting data will be stored within the database according to the
      [md-terminology-trove (MDTT)](https://github.com/carrollaboratory/md-terminology-trove)
      data model. Input will be structured, but the format will be dependent on
      source.
    entities:
      - name: Configuration Vocabulary
        description: |
          This will provide all details required for the trawler to ingest
          the data for each of the vocabularies
      - name: MDTT:Concept
        description: This captures the details for each term/concept
      - name: MDTT:Vocabulary
        description: |
          Details related to the vocabulary itself including non-standard
          information like the fhir-system

  interfaces:
    inputs:
      - name: YAML Configuration
        format: YAML
        description: |
          Configuration containing details relating to each of the vocabularies

      - name: OMOP Flat File
        format: TSV Format
        description: |
          For convenience, we can pull most of our terms from OMOP downloads.
          These files can either be loaded into a RDB and queried or parsed
          directly.

      - name: OWL File
        format: OWL
        description: |
          OWL is a robust, logic-based Semantic Web standard used to author
          ontologies.

    outputs:
      - name: "md-terminology-trove"
        format: "DBT Table data"
        description: "[md-terminology-trove](https://github.com/carrollaboratory/md-terminology-trove) is a schema whose data entries live within the data warehouse"

  dependencies:
    internal:
      - name: "LinkML SQL Alchemy Adapter"
        version: current
        purpose: |
          [linkml SQL Alchemy Adapter]([SQL Alchemy interface](https://github.com/carrollaboratory/piper/blob/main/src/piper/datamodel/linkml.py) can
          provide an OO interface to the database tables. It may not be necessary, however, using this may make porting to different databases more seamless
    external:
      - name: "rdflib"
        version: 7.6.0
        purpose: "[rdflib](https://github.com/RDFLib/rdflib) will be used to extract information from OWL files"

# ============================================================
# 6. IMPLEMENTATION APPROACH
# ============================================================
implementation:
  strategy: >
    A very basic CLI application that accepts a single YAML configuration that
    identifies which terminologies to load, the source for each of those
    terminologies and any additional metadata necessary for loading this data.
    Support for various source types and additional metadata can be added in
    separate stages.
  phases:
    - phase: 1
      name: "Core Process"
      description: |
        Basic CLI application will allow the application to be run either on a
        laptop or as part of an orchestrated pipeline. Components include:
          - CLI application
          - YAML Configuration direction to control ingestion and DB connection
          - Base adapter model
          - Source OMOP adapter
          - Source OWL adapter

  error_handling: >
    - Core Python exceptions will be used where suitable.
    - Basic DB connection issues will immediately halt.
    - Schema related issues will also cause hard stop
  logging: >
    WARNING and ERROR logging used appropriately
    INFO Level will include
      - Successful database connections
      - Vocabulary section and which adapter type is being used
      - filenames and URLs that are successfully acquired and processed
      - High level summary of DB entries added/updated
    DEBUG Level will include
      - SQL Statements if we are writing our own SQL
      - HTTP responses where appropriate
      - Complete record rows when using with a serialization library instead of SQL

